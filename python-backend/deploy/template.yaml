# GENERATED by deploy/generate_template.py from lambdas.py — edit those, then regenerate.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  GradeAnt API as Python 3.13 Lambdas, one per API path, sharing two layers:
  gradeant-python-deps (PyJWT, PyYAML, boto3) and gradeant-python-common (shared code
  and config/app.yaml). Each function has its own IAM role, limited to what its code
  reaches. Plug the functions into the existing API Gateway (see python-backend/README.md).
  Build first: python build.py --verify.

Parameters:
  DataRegion:
    Type: String
    Default: eu-north-1
    Description: Region of the DynamoDB tables, SNS topic and grading Lambda (deploy this stack there).
  RestApiId:
    Type: String
    Default: ''
    Description: ID of the existing API Gateway REST API (e.g. rus9nultj9). When set, it may invoke every function.
  JwtSecretArn:
    Type: String
    Description: Secrets Manager secret with the JWT key. Must be the SAME value the current Lambdas use.
  SessionSecretArn:
    Type: String
    Default: ''
    Description: Admin session-token secret (the admin Lambda's SESSION_TOKEN_SECRET). Empty = create a new random one.
  WebOrigins:
    Type: String
    Default: https://app.gradeant.io,https://grade-ant.com,https://www.grade-ant.com
    Description: Comma-separated browser origins allowed to call the API (CORS) and upload profile photos.
  ProfilePhotoBucketName:
    Type: String
    Default: ''
    Description: Existing profile-photo bucket. Empty = create a private, encrypted one.
  UploadBucketName:
    Type: String
    Default: ''
    Description: Bucket the grading pipeline reads uploads from. Empty = /uploadpdf stays off (keep the legacy upload Lambda).
  UploadKeyTemplate:
    Type: String
    Default: uploads/{uploadType}/{assignmentId}/{fileName}
  SesSenderEmail:
    Type: String
    Default: ''
    Description: SES-verified From address. Empty = no email is sent.
  ContactInbox:
    Type: String
    Default: contact@gradeant.com
  SnsTopicArn:
    Type: String
    Default: ''
    Description: SNS topic for "grades published". Empty = off.
  GradingFunctionName:
    Type: String
    Default: ''
    Description: Existing grading-pipeline Lambda, invoked asynchronously by "Start grading". Empty = off.
  GeminiModel:
    Type: String
    Default: gemini-3.5-flash-preview
    Description: The one Gemini model for every AI call (grading, reading answer sheets, rubric drafting, assistant).
  GeminiSecretArn:
    Type: String
    Default: ''
    Description: 'Secrets Manager secret holding the Gemini API key (a plain string, or JSON with a GEMINI_API_KEY field). Or use GeminiApiKey.'
  GeminiApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: 'Free-tier alternative to GeminiSecretArn: the key as an encrypted Lambda environment variable (no Secrets Manager cost).'
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: Optional SNS topic notified when the functions error.

  PipelineBucketName:
    Type: String
    Default: ''
    Description: Bucket the grading pipeline workers read and write (the original pipeline's bucket). Empty = workers off.
  PipelineRoot:
    Type: String
    Default: Data_warehouse
    Description: Top-level folder of the pipeline layout in that bucket.
  DatabaseProvider:
    Type: String
    Default: ''
    AllowedValues: ['', dynamodb, supabase]
    Description: 'Grading table for the grader: dynamodb or supabase. Empty = follow config/app.yaml (deployment: aws | hybrid).'
  SupabaseUrl:
    Type: String
    Default: ''
    Description: 'https://<project>.supabase.co (database: supabase).'
  SupabaseServiceRoleKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: 'Supabase service-role key (database: supabase); its grants are limited by backend/sql/003_supabase_access.sql.'
  GradeOnUpload:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: true = grade as soon as a parsed answer sheet lands (as today); false = wait for "Start grading".
  UploadLayout:
    Type: String
    Default: template
    AllowedValues: [template, pipeline]
    Description: '/uploadpdf object keys: template = UploadKeyTemplate (as today); pipeline = the grading pipeline layout (needs UploadBucketName = PipelineBucketName).'
  PipelineQueuesEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Turns the SQS → worker mappings on. Keep 'false' until the old pipeline Lambdas are detached from the queues.
  GraderQueueArn:
    Type: String
    Default: ''
    Description: SQS queue (ARN) of S3 events feeding this worker. Empty = no mapping.
  JsonifierQueueArn:
    Type: String
    Default: ''
    Description: SQS queue (ARN) of S3 events feeding this worker. Empty = no mapping.

Conditions:
  HasRestApi: !Not [!Equals [!Ref RestApiId, '']]
  CreateSessionSecret: !Equals [!Ref SessionSecretArn, '']
  CreatePhotoBucket: !Equals [!Ref ProfilePhotoBucketName, '']
  HasUploadBucket: !Not [!Equals [!Ref UploadBucketName, '']]
  HasSes: !Not [!Equals [!Ref SesSenderEmail, '']]
  HasSnsTopic: !Not [!Equals [!Ref SnsTopicArn, '']]
  HasGradingFunction: !Not [!Equals [!Ref GradingFunctionName, '']]
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]
  HasGeminiSecret: !Not [!Equals [!Ref GeminiSecretArn, '']]
  HasPipeline: !Not [!Equals [!Ref PipelineBucketName, '']]
  UsesDynamoDB: !Not [!Equals [!Ref DatabaseProvider, supabase]]
  PipelineQueuesOn: !Equals [!Ref PipelineQueuesEnabled, 'true']
  HasGraderQueueArn: !Not [!Equals [!Ref GraderQueueArn, '']]
  HasJsonifierQueueArn: !Not [!Equals [!Ref JsonifierQueueArn, '']]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    # Layers are set per function (the pipeline workers use their own package layer).
    Environment:
      Variables:
        # Same settings for every function (no secret values: only ARNs).
        APP_ENV: production
        AWS_DATA_REGION: !Ref DataRegion
        CORS_ALLOWED_ORIGINS: !Ref WebOrigins
        JWT_SECRET_ARN: !Ref JwtSecretArn
        SESSION_TOKEN_SECRET_ARN: !If [CreateSessionSecret, !Ref SessionSecret, !Ref SessionSecretArn]
        PROFILE_PHOTO_BUCKET: !If [CreatePhotoBucket, !Ref ProfilePhotoBucket, !Ref ProfilePhotoBucketName]
        UPLOAD_BUCKET: !Ref UploadBucketName
        UPLOAD_KEY_TEMPLATE: !Ref UploadKeyTemplate
        SES_SENDER_EMAIL: !Ref SesSenderEmail
        CONTACT_INBOX: !Ref ContactInbox
        SNS_TOPIC_ARN: !Ref SnsTopicArn
        GRADING_FUNCTION_NAME: !Ref GradingFunctionName
        GEMINI_MODEL: !Ref GeminiModel

Resources:
  # ---- Layers ----------------------------------------------------------------
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: gradeant-python-deps
      Description: GradeAnt API Python packages (PyJWT, PyYAML, boto3) for python3.13 arm64
      ContentUri: ../dist/layer-gradeant-python-deps.zip
      CompatibleRuntimes: [python3.13]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Retain

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: gradeant-python-common
      Description: GradeAnt shared code (gradeant_common) and config/app.yaml
      ContentUri: ../dist/layer-gradeant-python-common.zip
      CompatibleRuntimes: [python3.13]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Retain

  PipelineDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: gradeant-pipeline-deps
      Description: Grading pipeline packages (PyYAML, PyMuPDF, google-genai) for python3.13 arm64
      ContentUri: ../dist/layer-gradeant-pipeline-deps.zip
      CompatibleRuntimes: [python3.13]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Retain

  # ---- Shared resources --------------------------------------------------------
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSessionSecret
    Properties:
      Name: gradeant/session
      Description: GradeAnt admin first-login session-token signing key
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  ProfilePhotoBucket:
    Type: AWS::S3::Bucket
    Condition: CreatePhotoBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub gradeant-profile-photos-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-replaced-photos
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: !Split [',', !Ref WebOrigins]
            AllowedHeaders: ['*']
            MaxAge: 3000

  ProfilePhotoBucketTls:
    Type: AWS::S3::BucketPolicy
    Condition: CreatePhotoBucket
    Properties:
      Bucket: !Ref ProfilePhotoBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ProfilePhotoBucket.Arn
              - !Sub '${ProfilePhotoBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---- Functions (one per API path) -------------------------------------------
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-auth
      Description: POST /auth/* (login, signup, logout, forgot/change password, me, profile photo)
      CodeUri: ../dist/gradeant-auth.zip
      Handler: auth.lambda_handler
      MemorySize: 1024
      Timeout: 29
      Layers:
        - !Ref DepsLayer
        - !Ref CommonLayer
      LoggingConfig:
        LogGroup: !Ref AuthLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_*/index/*
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtSecretArn
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub
                - arn:aws:s3:::${Bucket}/profile-photos/*
                - Bucket: !If [CreatePhotoBucket, !Ref ProfilePhotoBucket, !Ref ProfilePhotoBucketName]

  GradesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-grades
      Description: POST /getgrades (one student’s result, class roster, total-mark edits)
      CodeUri: ../dist/gradeant-grades.zip
      Handler: grades.lambda_handler
      MemorySize: 512
      Timeout: 29
      Layers:
        - !Ref DepsLayer
        - !Ref CommonLayer
      LoggingConfig:
        LogGroup: !Ref GradesLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Announcements
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtSecretArn

  CorrectionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-corrections
      Description: POST /correctanswer (answer and question corrections)
      CodeUri: ../dist/gradeant-corrections.zip
      Handler: corrections.lambda_handler
      MemorySize: 512
      Timeout: 29
      Layers:
        - !Ref DepsLayer
        - !Ref CommonLayer
      LoggingConfig:
        LogGroup: !Ref CorrectionsLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Announcements
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtSecretArn

  MarksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-marks
      Description: POST /updatedb (teacher mark edits)
      CodeUri: ../dist/gradeant-marks.zip
      Handler: marks.lambda_handler
      MemorySize: 512
      Timeout: 29
      Layers:
        - !Ref DepsLayer
        - !Ref CommonLayer
      LoggingConfig:
        LogGroup: !Ref MarksLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Announcements
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtSecretArn

  WorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-workflow
      Description: POST /workflow (assignments, rubric, grading runs, publishing, assistant, student screens)
      CodeUri: ../dist/gradeant-workflow.zip
      Handler: workflow.lambda_handler
      MemorySize: 1024
      Timeout: 300
      Layers:
        - !Ref DepsLayer
        - !Ref PipelineDepsLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          GEMINI_API_KEY_ARN: !Ref GeminiSecretArn
          GEMINI_API_KEY: !Ref GeminiApiKey
      LoggingConfig:
        LogGroup: !Ref WorkflowLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Announcements
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtSecretArn
            - !If  # the Gemini key secret, only when GeminiSecretArn is set
              - HasGeminiSecret
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GeminiSecretArn
              - !Ref AWS::NoValue
            - Effect: Allow  # asynchronous self-invocation (AI rubric drafting)
              Action: lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:gradeant-workflow

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-admin
      Description: POST /admin (admin console and invite links)
      CodeUri: ../dist/gradeant-admin.zip
      Handler: admin.lambda_handler
      MemorySize: 1024
      Timeout: 29
      Layers:
        - !Ref DepsLayer
        - !Ref CommonLayer
      LoggingConfig:
        LogGroup: !Ref AdminLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_*/index/*
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtSecretArn
                - !If [CreateSessionSecret, !Ref SessionSecret, !Ref SessionSecretArn]

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-contact
      Description: POST /contact (public contact and request-a-pilot forms)
      CodeUri: ../dist/gradeant-contact.zip
      Handler: contact.lambda_handler
      MemorySize: 256
      Timeout: 15
      Layers:
        - !Ref DepsLayer
        - !Ref CommonLayer
      LoggingConfig:
        LogGroup: !Ref ContactLogs

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-upload
      Description: POST /uploadpdf (presigned upload URLs (off until UPLOAD_BUCKET is set))
      CodeUri: ../dist/gradeant-upload.zip
      Handler: upload.lambda_handler
      MemorySize: 512
      Timeout: 15
      Layers:
        - !Ref DepsLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          UPLOAD_LAYOUT: !Ref UploadLayout
          PIPELINE_BUCKET: !Ref PipelineBucketName
          PIPELINE_ROOT: !Ref PipelineRoot
      LoggingConfig:
        LogGroup: !Ref UploadLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments/index/*
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtSecretArn

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-health
      Description: GET /health, GET /health/ready (liveness and readiness checks)
      CodeUri: ../dist/gradeant-health.zip
      Handler: health.lambda_handler
      MemorySize: 256
      Timeout: 10
      Layers:
        - !Ref DepsLayer
        - !Ref CommonLayer
      LoggingConfig:
        LogGroup: !Ref HealthLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtSecretArn

  GraderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-grader
      Description: 'worker (grading pipeline: grades parsed answer sheets and Start-grading jobs (SQS) and workflow regrade invokes)'
      CodeUri: ../dist/gradeant-grader.zip
      Handler: grader.lambda_handler
      MemorySize: 1024
      Timeout: 900
      Layers:
        - !Ref PipelineDepsLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          PIPELINE_BUCKET: !Ref PipelineBucketName
          PIPELINE_ROOT: !Ref PipelineRoot
          GEMINI_API_KEY_ARN: !Ref GeminiSecretArn
          GEMINI_API_KEY: !Ref GeminiApiKey
          GRADE_ON_UPLOAD: !Ref GradeOnUpload
          GRADER_MAX_WORKERS: '4'
          DATABASE_PROVIDER: !Ref DatabaseProvider
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt GraderFailureQueue.Arn
      LoggingConfig:
        LogGroup: !Ref GraderLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - !If
              - UsesDynamoDB
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan, dynamodb:BatchWriteItem]
                Resource:
                  - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading
                  - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading/index/*
              - !Ref AWS::NoValue
            - Effect: Allow  # failed asynchronous invocations go to the failure queue
              Action: sqs:SendMessage
              Resource: !GetAtt GraderFailureQueue.Arn

  JsonifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-jsonifier
      Description: 'worker (grading pipeline: answer-sheet PDF to JSON in the question paper schema (SQS))'
      CodeUri: ../dist/gradeant-jsonifier.zip
      Handler: jsonifier.lambda_handler
      MemorySize: 2048
      Timeout: 900
      Layers:
        - !Ref PipelineDepsLayer
        - !Ref CommonLayer
      Environment:
        Variables:
          PIPELINE_BUCKET: !Ref PipelineBucketName
          PIPELINE_ROOT: !Ref PipelineRoot
          GEMINI_API_KEY_ARN: !Ref GeminiSecretArn
          GEMINI_API_KEY: !Ref GeminiApiKey
      LoggingConfig:
        LogGroup: !Ref JsonifierLogs

  # ---- Optional permissions: each exists only when its setting is filled in ----
  EmailPolicy:
    Type: AWS::IAM::Policy
    Condition: HasSes
    Properties:
      PolicyName: email
      Roles: [!Ref WorkflowFunctionRole, !Ref AdminFunctionRole, !Ref ContactFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: '*'
            Condition:
              StringEquals:
                ses:FromAddress: !Ref SesSenderEmail

  NotifyPolicy:
    Type: AWS::IAM::Policy
    Condition: HasSnsTopic
    Properties:
      PolicyName: notify
      Roles: [!Ref WorkflowFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref SnsTopicArn

  GradingPolicy:
    Type: AWS::IAM::Policy
    Condition: HasGradingFunction
    Properties:
      PolicyName: grading
      Roles: [!Ref WorkflowFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub arn:aws:lambda:${DataRegion}:${AWS::AccountId}:function:${GradingFunctionName}

  UploadPolicy:
    Type: AWS::IAM::Policy
    Condition: HasUploadBucket
    Properties:
      PolicyName: uploads
      Roles: [!Ref UploadFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject]
            Resource: !Sub arn:aws:s3:::${UploadBucketName}/*

  PipelinePolicy:
    Type: AWS::IAM::Policy
    Condition: HasPipeline
    Properties:
      PolicyName: pipeline
      Roles: [!Ref GraderFunctionRole, !Ref JsonifierFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject]
            Resource: !Sub arn:aws:s3:::${PipelineBucketName}/${PipelineRoot}/*
          - Effect: Allow  # lets a missing key answer 404 instead of 403
            Action: s3:ListBucket
            Resource: !Sub arn:aws:s3:::${PipelineBucketName}
            Condition:
              StringLike:
                s3:prefix: !Sub ${PipelineRoot}/*

  PipelineSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: HasGeminiSecret
    Properties:
      PolicyName: pipeline-gemini-secret
      Roles: [!Ref GraderFunctionRole, !Ref JsonifierFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref GeminiSecretArn

  # ---- Pipeline workers: SQS feeds and failure queues ----------------------------
  GraderQueuePolicy:
    Type: AWS::IAM::Policy
    Condition: HasGraderQueueArn
    Properties:
      PolicyName: grader-queue
      Roles: [!Ref GraderFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
            Resource: !Ref GraderQueueArn

  GraderQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasGraderQueueArn
    DependsOn: GraderQueuePolicy
    Properties:
      FunctionName: !Ref GraderFunction
      EventSourceArn: !Ref GraderQueueArn
      Enabled: !If [PipelineQueuesOn, true, false]
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 5

  GraderFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: gradeant-grader-failures
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  JsonifierQueuePolicy:
    Type: AWS::IAM::Policy
    Condition: HasJsonifierQueueArn
    Properties:
      PolicyName: jsonifier-queue
      Roles: [!Ref JsonifierFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
            Resource: !Ref JsonifierQueueArn

  JsonifierQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasJsonifierQueueArn
    DependsOn: JsonifierQueuePolicy
    Properties:
      FunctionName: !Ref JsonifierFunction
      EventSourceArn: !Ref JsonifierQueueArn
      Enabled: !If [PipelineQueuesOn, true, false]
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 5

  # ---- The existing REST API may invoke every function ------------------------
  AuthApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  GradesApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref GradesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  CorrectionsApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref CorrectionsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  MarksApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref MarksFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  WorkflowApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref WorkflowFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  AdminApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref AdminFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  ContactApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref ContactFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  UploadApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref UploadFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  HealthApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref HealthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  # ---- Logs (one group per function, with retention) ----------------------------
  AuthLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-auth
      RetentionInDays: !Ref LogRetentionDays

  GradesLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-grades
      RetentionInDays: !Ref LogRetentionDays

  CorrectionsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-corrections
      RetentionInDays: !Ref LogRetentionDays

  MarksLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-marks
      RetentionInDays: !Ref LogRetentionDays

  WorkflowLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-workflow
      RetentionInDays: !Ref LogRetentionDays

  AdminLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-admin
      RetentionInDays: !Ref LogRetentionDays

  ContactLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-contact
      RetentionInDays: !Ref LogRetentionDays

  UploadLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-upload
      RetentionInDays: !Ref LogRetentionDays

  HealthLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-health
      RetentionInDays: !Ref LogRetentionDays

  GraderLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-grader
      RetentionInDays: !Ref LogRetentionDays

  JsonifierLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-jsonifier
      RetentionInDays: !Ref LogRetentionDays

  # ---- Alarms -------------------------------------------------------------------
  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gradeant-python-errors
      AlarmDescription: GradeAnt functions crashed or timed out 5 or more times in 5 minutes (all functions together).
      Metrics:
        - Id: total
          Label: Errors (all functions)
          Expression: SUM(METRICS())
          ReturnData: true
        - Id: e0
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref AuthFunction
            Period: 300
            Stat: Sum
        - Id: e1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GradesFunction
            Period: 300
            Stat: Sum
        - Id: e2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref CorrectionsFunction
            Period: 300
            Stat: Sum
        - Id: e3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref MarksFunction
            Period: 300
            Stat: Sum
        - Id: e4
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref WorkflowFunction
            Period: 300
            Stat: Sum
        - Id: e5
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref AdminFunction
            Period: 300
            Stat: Sum
        - Id: e6
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ContactFunction
            Period: 300
            Stat: Sum
        - Id: e7
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref UploadFunction
            Period: 300
            Stat: Sum
        - Id: e8
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref HealthFunction
            Period: 300
            Stat: Sum
        - Id: e9
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GraderFunction
            Period: 300
            Stat: Sum
        - Id: e10
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref JsonifierFunction
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  AuthFunctionArn:
    Value: !GetAtt AuthFunction.Arn
  GradesFunctionArn:
    Value: !GetAtt GradesFunction.Arn
  CorrectionsFunctionArn:
    Value: !GetAtt CorrectionsFunction.Arn
  MarksFunctionArn:
    Value: !GetAtt MarksFunction.Arn
  WorkflowFunctionArn:
    Value: !GetAtt WorkflowFunction.Arn
  AdminFunctionArn:
    Value: !GetAtt AdminFunction.Arn
  ContactFunctionArn:
    Value: !GetAtt ContactFunction.Arn
  UploadFunctionArn:
    Value: !GetAtt UploadFunction.Arn
  HealthFunctionArn:
    Value: !GetAtt HealthFunction.Arn
  GraderFunctionArn:
    Value: !GetAtt GraderFunction.Arn
  JsonifierFunctionArn:
    Value: !GetAtt JsonifierFunction.Arn
  DepsLayerArn:
    Value: !Ref DepsLayer
  CommonLayerArn:
    Value: !Ref CommonLayer
  ProfilePhotoBucket:
    Value: !If [CreatePhotoBucket, !Ref ProfilePhotoBucket, !Ref ProfilePhotoBucketName]
  SessionSecretArn:
    Value: !If [CreateSessionSecret, !Ref SessionSecret, !Ref SessionSecretArn]
  PipelineDepsLayerArn:
    Value: !Ref PipelineDepsLayer
  GraderFailureQueueUrl:
    Value: !Ref GraderFailureQueue
