  # ---- Alarms -------------------------------------------------------------------
  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gradeant-lambdas-errors
      AlarmDescription: GradeAnt functions crashed or timed out 5 or more times in 5 minutes (all functions together).
      Metrics:
        - Id: total
          Label: Errors (all functions)
          Expression: SUM(METRICS())
          ReturnData: true
        - Id: e0
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref AuthFunction
            Period: 300
            Stat: Sum
        - Id: e1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GradesFunction
            Period: 300
            Stat: Sum
        - Id: e2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref CorrectionsFunction
            Period: 300
            Stat: Sum
        - Id: e3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref MarksFunction
            Period: 300
            Stat: Sum
        - Id: e4
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref WorkflowFunction
            Period: 300
            Stat: Sum
        - Id: e5
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref AdminFunction
            Period: 300
            Stat: Sum
        - Id: e6
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ContactFunction
            Period: 300
            Stat: Sum
        - Id: e7
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref UploadFunction
            Period: 300
            Stat: Sum
        - Id: e8
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref HealthFunction
            Period: 300
            Stat: Sum
        - Id: e9
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref JobsFunction
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  JobsDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: gradeant-jobs-failed
      AlarmDescription: A background job (AI rubric drafting) failed 3 times and was moved to the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt JobsDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  AuthFunctionArn:
    Value: !GetAtt AuthFunction.Arn
  GradesFunctionArn:
    Value: !GetAtt GradesFunction.Arn
  CorrectionsFunctionArn:
    Value: !GetAtt CorrectionsFunction.Arn
  MarksFunctionArn:
    Value: !GetAtt MarksFunction.Arn
  WorkflowFunctionArn:
