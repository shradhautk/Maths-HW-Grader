AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  GradeAnt API as one Lambda per API path (Node.js 24, Arm64), sharing two layers:
  gradeant-deps (npm packages) and gradeant-app (the backend code). Each function has
  its own role, limited to the AWS services and tables its code reaches (lambdas/functions.js,
  from the graphify dependency graph). Plug the functions into the existing API Gateway
  (see lambdas/LAMBDAS.md). Build first: npm run package:lambdas -- --verify.

Parameters:
  DataRegion:
    Type: String
    Default: eu-north-1
    Description: Region of the DynamoDB tables, SNS topic and grading Lambda (deploy this stack there).
  RestApiId:
    Type: String
    Default: ''
    Description: >-
      ID of the existing API Gateway REST API (e.g. rus9nultj9). When set, that API is allowed to
      invoke every function. Leave empty if you will wire a different front door.
  JwtSecretArn:
    Type: String
    Description: Secrets Manager secret with the JWT key. Must be the SAME value the Python Lambdas use.
  SessionSecretArn:
    Type: String
    Default: ''
    Description: Admin session-token secret (the admin Lambda's SESSION_TOKEN_SECRET). Empty = create a new random one.
  WebOrigins:
    Type: String
    Default: https://app.gradeant.io,https://grade-ant.com,https://www.grade-ant.com
    Description: Comma-separated browser origins allowed to call the API (CORS) and upload profile photos.
  ProfilePhotoBucketName:
    Type: String
    Default: ''
    Description: Existing profile-photo bucket. Empty = create a private, encrypted one.
  UploadBucketName:
    Type: String
    Default: ''
    Description: Bucket the grading pipeline reads uploads from. Empty = /uploadpdf stays off (keep the legacy upload Lambda).
  UploadKeyTemplate:
    Type: String
    Default: uploads/{uploadType}/{assignmentId}/{fileName}
  SesSenderEmail:
    Type: String
    Default: ''
    Description: SES-verified From address. Empty = no email is sent.
  ContactInbox:
    Type: String
    Default: contact@gradeant.com
  SnsTopicArn:
    Type: String
    Default: ''
    Description: SNS topic for "grades published". Empty = off.
  GradingFunctionName:
    Type: String
    Default: ''
    Description: Existing grading-pipeline Lambda, invoked asynchronously by "Start grading". Empty = off.
  GeminiModel:
    Type: String
    Default: gemini-3.5-flash-preview
    Description: The one Gemini model for every AI call (GradeFlow assistant, rubric drafting, grading).
  GeminiSecretArn:
    Type: String
    Default: ''
    Description: 'Secrets Manager secret holding the Gemini API key (a plain string, or JSON with a GEMINI_API_KEY field). Or use GeminiApiKey.'
  GeminiApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: 'Alternative to GeminiSecretArn: the key as an encrypted Lambda environment variable.'
  Runtime:
    Type: String
    Default: nodejs24.x
    AllowedValues: [nodejs22.x, nodejs24.x]
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: Optional SNS topic notified when any function errors or the jobs queue backs up.

Conditions:
  HasGeminiSecret: !Not [!Equals [!Ref GeminiSecretArn, '']]
  HasRestApi: !Not [!Equals [!Ref RestApiId, '']]
  CreateSessionSecret: !Equals [!Ref SessionSecretArn, '']
  CreatePhotoBucket: !Equals [!Ref ProfilePhotoBucketName, '']
  HasUploadBucket: !Not [!Equals [!Ref UploadBucketName, '']]
  HasSes: !Not [!Equals [!Ref SesSenderEmail, '']]
  HasSnsTopic: !Not [!Equals [!Ref SnsTopicArn, '']]
  HasGradingFunction: !Not [!Equals [!Ref GradingFunctionName, '']]
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]

Globals:
  Function:
    Runtime: !Ref Runtime
    Architectures: [arm64]
    Handler: index.handler
    Layers:
      - !Ref DepsLayer
      - !Ref AppLayer
    Environment:
      Variables:
        # Same settings for every function (no secret values: only ARNs).
        APP_ENV: production
        NODE_OPTIONS: --enable-source-maps
        AWS_DATA_REGION: !Ref DataRegion
        CORS_ALLOWED_ORIGINS: !Ref WebOrigins
        JWT_SECRET_ARN: !Ref JwtSecretArn
        SESSION_TOKEN_SECRET_ARN: !If [CreateSessionSecret, !Ref SessionSecret, !Ref SessionSecretArn]
        PROFILE_PHOTO_BUCKET: !If [CreatePhotoBucket, !Ref ProfilePhotoBucket, !Ref ProfilePhotoBucketName]
        UPLOAD_BUCKET: !Ref UploadBucketName
        UPLOAD_KEY_TEMPLATE: !Ref UploadKeyTemplate
        SES_SENDER_EMAIL: !Ref SesSenderEmail
        CONTACT_INBOX: !Ref ContactInbox
        SNS_TOPIC_ARN: !Ref SnsTopicArn
        GRADING_FUNCTION_NAME: !Ref GradingFunctionName
        GEMINI_MODEL: !Ref GeminiModel
        GEMINI_API_KEY_ARN: !Ref GeminiSecretArn
        GEMINI_API_KEY: !Ref GeminiApiKey
        # AI rubric drafting runs in gradeant-jobs (API Gateway stops requests at 29 s).
        JOBS_DRIVER: sqs
        JOBS_QUEUE_URL: !Ref JobsQueue

Resources:
  # ---- Layers ----------------------------------------------------------------
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: gradeant-deps
      Description: GradeAnt API npm packages (production node_modules)
      ContentUri: ../dist/lambdas/layer-gradeant-deps.zip
      CompatibleRuntimes: [nodejs22.x, nodejs24.x]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Retain

  AppLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: gradeant-app
      Description: GradeAnt API code (backend/src, lambdas/, config/app.yaml, .env.production)
      ContentUri: ../dist/lambdas/layer-gradeant-app.zip
      CompatibleRuntimes: [nodejs22.x, nodejs24.x]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Retain

  # ---- Shared resources --------------------------------------------------------
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSessionSecret
    Properties:
      Name: gradeant/session
      Description: GradeAnt admin first-login session-token signing key
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  ProfilePhotoBucket:
    Type: AWS::S3::Bucket
    Condition: CreatePhotoBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub gradeant-profile-photos-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-replaced-photos
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: !Split [',', !Ref WebOrigins]
            AllowedHeaders: ['*']
            MaxAge: 3000

  ProfilePhotoBucketTls:
    Type: AWS::S3::BucketPolicy
    Condition: CreatePhotoBucket
    Properties:
      Bucket: !Ref ProfilePhotoBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ProfilePhotoBucket.Arn
              - !Sub '${ProfilePhotoBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  JobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: gradeant-jobs-dlq
      MessageRetentionPeriod: 1209600 # 14 days to inspect failed jobs
      SqsManagedSseEnabled: true

  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: gradeant-jobs
      VisibilityTimeout: 1800 # 6 × the jobs function timeout, as AWS recommends
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobsDeadLetterQueue.Arn
        maxReceiveCount: 3

  # ---- Functions (one per API path) -------------------------------------------
  # Permissions per function = what its code reaches in the dependency graph.
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-auth
      Description: POST /auth/* (login, signup, logout, forgot/change password, me, profile photo)
      CodeUri: ../dist/lambdas/gradeant-auth.zip
      MemorySize: 1024
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref AuthLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_*/index/*
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtSecretArn
                - !If [CreateSessionSecret, !Ref SessionSecret, !Ref SessionSecretArn]
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub
                - arn:aws:s3:::${Bucket}/profile-photos/*
                - Bucket: !If [CreatePhotoBucket, !Ref ProfilePhotoBucket, !Ref ProfilePhotoBucketName]

  GradesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-grades
      Description: POST /getgrades
      CodeUri: ../dist/lambdas/gradeant-grades.zip
      MemorySize: 512
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref GradesLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Announcements
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecretArn

  CorrectionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-corrections
      Description: POST /correctanswer
      CodeUri: ../dist/lambdas/gradeant-corrections.zip
      MemorySize: 512
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref CorrectionsLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Announcements
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecretArn

  MarksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-marks
      Description: POST /updatedb
      CodeUri: ../dist/lambdas/gradeant-marks.zip
      MemorySize: 512
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref MarksLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Announcements
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecretArn

  WorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-workflow
      Description: POST /workflow (assignments, rubric, grading runs, publishing, assistant, student screens)
      CodeUri: ../dist/lambdas/gradeant-workflow.zip
      MemorySize: 1024
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref WorkflowLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Announcements
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecretArn
            - !If  # the Gemini key secret, only when GeminiSecretArn is set
              - HasGeminiSecret
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GeminiSecretArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt JobsQueue.Arn

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-admin
      Description: POST /admin (admin console, invite links)
      CodeUri: ../dist/lambdas/gradeant-admin.zip
      MemorySize: 1024
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref AdminLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_*/index/*
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtSecretArn
                - !If [CreateSessionSecret, !Ref SessionSecret, !Ref SessionSecretArn]

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-contact
      Description: POST /contact (public contact and request-a-pilot forms)
      CodeUri: ../dist/lambdas/gradeant-contact.zip
      MemorySize: 256
      Timeout: 15
      LoggingConfig:
        LogGroup: !Ref ContactLogs

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-upload
      Description: POST /uploadpdf (presigned upload URLs; off until UploadBucketName is set)
      CodeUri: ../dist/lambdas/gradeant-upload.zip
      MemorySize: 512
      Timeout: 15
      LoggingConfig:
        LogGroup: !Ref UploadLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecretArn

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-health
      Description: GET /health and /health/ready
      CodeUri: ../dist/lambdas/gradeant-health.zip
      MemorySize: 256
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref HealthLogs
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref JwtSecretArn

  JobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: gradeant-jobs
      Description: SQS worker for background jobs (AI rubric drafting)
      CodeUri: ../dist/lambdas/gradeant-jobs.zip
      MemorySize: 1024
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref JobsLogs
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
              Resource:
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/Users
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/assignment_grading/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Assignments/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Submissions/index/*
                - !Sub arn:aws:dynamodb:${DataRegion}:${AWS::AccountId}:table/GradeAnt_Announcements
            - !If  # the Gemini key secret, only when GeminiSecretArn is set
              - HasGeminiSecret
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GeminiSecretArn
              - !Ref AWS::NoValue

  # ---- Optional permissions: each exists only when its setting is filled in ----
  EmailPolicy:
    Type: AWS::IAM::Policy
    Condition: HasSes
    Properties:
      PolicyName: email
      Roles: [!Ref AdminFunctionRole, !Ref ContactFunctionRole, !Ref WorkflowFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: '*'
            Condition:
              StringEquals:
                ses:FromAddress: !Ref SesSenderEmail

  NotifyPolicy:
    Type: AWS::IAM::Policy
    Condition: HasSnsTopic
    Properties:
      PolicyName: notify
      Roles: [!Ref WorkflowFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref SnsTopicArn

  GradingPolicy:
    Type: AWS::IAM::Policy
    Condition: HasGradingFunction
    Properties:
      PolicyName: grading
      Roles: [!Ref WorkflowFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub arn:aws:lambda:${DataRegion}:${AWS::AccountId}:function:${GradingFunctionName}

  UploadPolicy:
    Type: AWS::IAM::Policy
    Condition: HasUploadBucket
    Properties:
      PolicyName: uploads
      Roles: [!Ref UploadFunctionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [s3:PutObject, s3:GetObject]
            Resource: !Sub arn:aws:s3:::${UploadBucketName}/*

  # ---- The existing REST API may invoke the API functions ---------------------
  AuthApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  GradesApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref GradesFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  CorrectionsApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref CorrectionsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  MarksApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref MarksFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  WorkflowApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref WorkflowFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  AdminApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref AdminFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  ContactApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref ContactFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  UploadApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref UploadFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  HealthApiInvoke:
    Type: AWS::Lambda::Permission
    Condition: HasRestApi
    Properties:
      FunctionName: !Ref HealthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApiId}/*

  # ---- Logs (one group per function, with retention) ----------------------------
  AuthLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-auth
      RetentionInDays: !Ref LogRetentionDays

  GradesLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-grades
      RetentionInDays: !Ref LogRetentionDays

  CorrectionsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-corrections
      RetentionInDays: !Ref LogRetentionDays

  MarksLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/gradeant-marks
