<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GradeAnt | AI that grades handwritten math and physics</title>
    <!-- Each public page updates the description, og:title, og:description, og:url and canonical as it loads. -->
    <meta
      name="description"
      content="Teachers upload scanned work. GradeAnt checks every step of handwritten math and physics against your rubric and drafts feedback for you to review."
    />
    <link rel="canonical" href="https://grade-ant.com/" />

    <!-- Sharing preview (LinkedIn, Slack, X...). og:image must be an absolute URL, 1200×630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GradeAnt" />
    <meta property="og:url" content="https://grade-ant.com/" />
    <meta property="og:title" content="GradeAnt | AI that grades handwritten math and physics" />
    <meta
      property="og:description"
      content="Teachers upload scanned work. GradeAnt checks every step against your rubric and drafts feedback for you to review."
    />
    <meta property="og:image" content="https://grade-ant.com/img/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GradeAnt: AI that grades handwritten math and physics, step by step." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GradeAnt | AI that grades handwritten math and physics" />
    <meta
      name="twitter:description"
      content="Teachers upload scanned work. GradeAnt checks every step against your rubric and drafts feedback for you to review."
    />
    <meta name="twitter:image" content="https://grade-ant.com/img/og-image.png" />

    <meta name="theme-color" content="#14213D" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/img/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Public site: Plus Jakarta Sans only. Poppins and JetBrains Mono are still used inside the logged-in app. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Icons: Material Icons (app) and Material Symbols Outlined, the line set used on the public site. -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
